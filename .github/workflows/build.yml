name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Create Project Files
      run: |
        mkdir -p app/src/main/java/com/baxtiyorov/security
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        mkdir -p app/src/main/res/drawable

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "ApkQoriqchi"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.2.2' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.baxtiyorov.security'
            compileSdk 34
            defaultConfig {
                applicationId "com.baxtiyorov.security"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
            <application
                android:allowBackup="true"
                android:icon="@drawable/app_logo"
                android:label="Apk Qo'riqchi"
                android:roundIcon="@drawable/app_logo"
                android:supportsRtl="true"
                android:theme="@style/Theme.ApkSecurity">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".InstallBlockerService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault|flagRetrieveInteractiveWindows"
            android:canRetrieveWindowContent="true"
            android:description="@string/accessibility_desc"
            android:notificationTimeout="100" />
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Apk Qo\'riqchi</string>
            <string name="accessibility_desc">Firibgarlar yuboradigan xavfli APK fayllardan himoya qilish uchun ruxsat bering.</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.ApkSecurity" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                <item name="colorPrimary">#1565C0</item>
            </style>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/app_logo.xml
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="128dp"
            android:height="128dp"
            android:viewportWidth="24"
            android:viewportHeight="24">
            <path android:fillColor="#1565C0" android:pathData="M12,1L3,5v6c0,5.55 3.84,10.74 9,12c5.16,-1.26 9,-6.45 9,-12V5L12,1z" />
            <path android:fillColor="#FFFFFF" android:pathData="M10,15.5l-3.5,-3.5l1.41,-1.41L10,12.67l6.09,-6.09L17.5,8L10,15.5z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            xmlns:app="http://schemas.android.com/apk/res-auto"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:background="#F8FAFC"
            android:gravity="center_horizontal"
            android:orientation="vertical"
            android:padding="24dp">
            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:layout_marginTop="30dp"
                android:text="APK Qo'riqchi"
                android:textColor="#0F172A"
                android:textSize="26sp"
                android:textStyle="bold" />
            <ImageView
                android:layout_width="140dp"
                android:layout_height="140dp"
                android:layout_marginTop="30dp"
                android:src="@drawable/app_logo" />
            <com.google.android.material.card.MaterialCardView
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:layout_marginTop="30dp"
                app:cardCornerRadius="16dp"
                app:strokeWidth="1dp"
                app:strokeColor="#CBD5E1">
                <LinearLayout
                    android:layout_width="match_parent"
                    android:layout_height="wrap_content"
                    android:orientation="vertical"
                    android:padding="20dp"
                    android:gravity="center">
                    <TextView
                        android:id="@+id/tvStatus"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:text="Himoya: O'chirilgan"
                        android:textColor="#DC2626"
                        android:textSize="18sp"
                        android:textStyle="bold" />
                    <Button
                        android:id="@+id/btnEnable"
                        android:layout_width="wrap_content"
                        android:layout_height="wrap_content"
                        android:layout_marginTop="12dp"
                        android:backgroundTint="#1565C0"
                        android:text="Himoyani yoqish" />
                </LinearLayout>
            </com.google.android.material.card.MaterialCardView>
            <View
                android:layout_width="match_parent"
                android:layout_height="0dp"
                android:layout_weight="1" />
            <Button
                android:id="@+id/btnScan"
                android:layout_width="match_parent"
                android:layout_height="54dp"
                android:backgroundTint="#1E293B"
                android:text="O'rnatilgan ilovalarni tekshirish"
                app:cornerRadius="12dp" />
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/java/com/baxtiyorov/security/InstallBlockerService.kt
        package com.baxtiyorov.security

        import android.accessibilityservice.AccessibilityService
        import android.view.accessibility.AccessibilityEvent
        import android.view.accessibility.AccessibilityNodeInfo
        import android.widget.Toast

        class InstallBlockerService : AccessibilityService() {
            private val installers = listOf(
                "com.android.packageinstaller",
                "com.google.android.packageinstaller",
                "com.samsung.android.packageinstaller",
                "com.miui.packageinstaller"
            )

            override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                val pkg = event?.packageName?.toString() ?: return
                if (installers.contains(pkg)) {
                    val root = rootInActiveWindow ?: return
                    val words = listOf("Bekor qilish", "Отмена", "Cancel")
                    for (w in words) {
                        val list = root.findAccessibilityNodeInfosByText(w)
                        for (item in list) {
                            if (item.isClickable) {
                                item.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                                Toast.makeText(this, "Apk Qo'riqchi: Xavfli o'rnatish to'xtatildi!", Toast.LENGTH_LONG).show()
                                return
                            }
                        }
                    }
                    performGlobalAction(GLOBAL_ACTION_BACK)
                }
            }
            override fun onInterrupt() {}
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/baxtiyorov/security/MainActivity.kt
        package com.baxtiyorov.security

        import android.content.Context
        import android.content.Intent
        import android.content.pm.PackageManager
        import android.graphics.Color
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.TextView
        import androidx.appcompat.app.AlertDialog
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            private lateinit var tvStatus: TextView
            private lateinit var btnEnable: Button

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                tvStatus = findViewById(R.id.tvStatus)
                btnEnable = findViewById(R.id.btnEnable)
                val btnScan = findViewById<Button>(R.id.btnScan)

                btnEnable.setOnClickListener {
                    startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                }

                btnScan.setOnClickListener {
                    val pm = packageManager
                    val pkgs = pm.getInstalledPackages(PackageManager.GET_PERMISSIONS)
                    val risky = mutableListOf<String>()
                    for (p in pkgs) {
                        val perms = p.requestedPermissions ?: continue
                        if (perms.contains("android.permission.READ_SMS") && perms.contains("android.permission.RECEIVE_SMS")) {
                            risky.add(p.applicationInfo.loadLabel(pm).toString())
                        }
                    }
                    val msg = if (risky.isEmpty()) "Xavfli SMS o'quvchi ilovalar topilmadi!" else "SMS o'qish huquqi bor ilovalar:\n" + risky.joinToString("\n")
                    AlertDialog.Builder(this).setTitle("Tekshiruv").setMessage(msg).setPositiveButton("OK", null).show()
                }
            }

            override fun onResume() {
                super.onResume()
                val isEnabled = isServiceEnabled(this, InstallBlockerService::class.java)
                if (isEnabled) {
                    tvStatus.text = "Himoya: Faol"
                    tvStatus.setTextColor(Color.parseColor("#16A34A"))
                    btnEnable.text = "Sozlamalarni ko'rish"
                } else {
                    tvStatus.text = "Himoya: O'chirilgan"
                    tvStatus.setTextColor(Color.parseColor("#DC2626"))
                    btnEnable.text = "Himoyani yoqish"
                }
            }

            private fun isServiceEnabled(ctx: Context, cls: Class<*>): Boolean {
                val s = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
                return s.contains(cls.name)
            }
        }
        EOF

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Apk-Qoriqchi
        path: app/build/outputs/apk/debug/app-debug.apk
